name: Cross-build Linux Bazel

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [loongarch64, riscv64, s390x, ppc64le]
    env:
      TARGET_CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install runtime and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: true
      - name: Prepare target JDK
        run: bash tools/cross_compile/prepare_jdk.sh "$TARGET_CPU" "$RUNNER_TEMP/target-jdk"
      - name: Cross-build Bazel
        env:
          BAZEL_CROSS_CPU: ${{ matrix.cpu }}
          BAZEL_CROSS_JAVA_HOME: ${{ runner.temp }}/target-jdk
          BAZEL_BINARY: bazel
          RELEASE_NAME: ${{ github.ref_name }}
          GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export BAZEL_CROSS_ZIG="$(command -v zig)"
          bash tools/cross_compile/cross_build.sh "$RUNNER_TEMP/cross-build"
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-linux-${{ matrix.cpu }}
          path: ${{ runner.temp }}/cross-build/artifacts/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bazel-linux-*
          path: artifacts
      - name: Prepare release assets
        env:
          RELEASE_LABEL: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          version=${RELEASE_LABEL//\//-}
          for cpu in loongarch64 riscv64 s390x ppc64le; do
            cp "artifacts/bazel-linux-$cpu/bazel" "release-assets/bazel-$version-linux-$cpu"
            cp "artifacts/bazel-linux-$cpu/bazel_nojdk" "release-assets/bazel_nojdk-$version-linux-$cpu"
            cp "artifacts/bazel-linux-$cpu/install.sh" "release-assets/bazel-$version-installer-linux-$cpu.sh"
          done
      - name: Sign release assets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd release-assets
          for file in *; do
            sha256sum "$file" > "$file.sha256"
            printf '%s\n' "$PASSPHRASE" | gpg --batch --no-tty --pinentry-mode loopback --passphrase-fd 0 --digest-algo SHA256 --detach-sign "$file"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
